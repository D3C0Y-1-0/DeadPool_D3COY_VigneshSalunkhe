{
  "device.node_id": "fileserv-01",
  "device.listen_addr": "0.0.0.0",
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.38-log",
  "ftp.enabled": true,
  "ftp.port": 21,
  "ftp.banner": "FTP server ready",
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/logs/opencanary.log"
        }
      }
    }
  }
}
